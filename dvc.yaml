stages:
  data_ingestion:
    cmd: python src/data/data_ingestion.py
    deps:
    - src/data/data_ingestion.py
    - data/external/tweets_v8.csv
    params:
    - data_ingestion.source_path
    - data_ingestion.test_size
    outs:
    - data/raw

  data_labeling:
    cmd: python src/data/data_labeling.py
    deps:
    - data/raw/train.csv
    - data/raw/test.csv
    - src/data/data_labeling.py
    params:
    - data_labeling.positive_threshold
    - data_labeling.negative_threshold
    outs:
    - data/labelled

  data_preprocessing:
    cmd: python src/data/data_preprocessing.py
    deps:
    - data/labelled/train_labelled.csv
    - data/labelled/test_labelled.csv
    - src/data/data_preprocessing.py
    outs:
    - data/interim

  model_building:
    cmd: python src/model/model_building.py
    deps:
    - data/interim/train_processed.csv
    - src/model/model_building.py
    params:
    - model_building.max_features
    - model_building.ngram_range
    - model_building.learning_rate
    - model_building.max_depth
    - model_building.n_estimators
    - model_building.reg_alpha
    - model_building.reg_lambda
    - model_building.is_unbalance
    - model_building.class_weight
    outs:
    - lgbm_model.pkl
    - tfidf_vectorizer.pkl

  model_evaluation:
    cmd: python src/model/model_evaluation.py
    deps:
    - lgbm_model.pkl
    - tfidf_vectorizer.pkl
    - data/interim/train_processed.csv
    - data/interim/test_processed.csv
    - src/model/model_evaluation.py
    outs:
    - experiment_info.json

  model_registration:
    cmd: python src/model/register_model.py
    deps:
    - experiment_info.json
    - src/model/register_model.py
