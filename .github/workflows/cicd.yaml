name: CICD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

jobs:
  # Repository-level validation: runs on every push/PR without requiring data
  repo-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip list | grep -E "flake8|black|isort|mypy"

      - name: Download NLTK data
        run: |
          python -c "import nltk; nltk.download('stopwords'); nltk.download('wordnet')"

      - name: Run linting
        run: |
          flake8 src scripts flask_app

      - name: Check formatting
        run: |
          black --check --line-length=99 src scripts flask_app
          isort --check --profile black --line-length=99 src scripts flask_app

      - name: Type checking
        run: |
          mypy --ignore-missing-imports --disallow-untyped-defs src

      - name: Run unit tests (no data required)
        run: |
          pytest scripts/test_preprocessing.py scripts/test_params_flatten.py scripts/mlflow_test.py -v

      - name: Run MLflow connection test
        run: |
          pytest scripts/test_load_model.py -v

  # Data-dependent validation: runs only when DVC data is available
  data-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip list | grep -E "flake8|black|isort|mypy"

      - name: Pull DVC-tracked data (if a remote is configured)
        run: |
          if dvc remote list 2>/dev/null | grep -q .; then
            dvc pull
          elif [ -f data/external/tweets_v8.csv ]; then
            echo "Source dataset present locally; skipping dvc pull."
          else
            echo "No DVC remote configured and no local data. Skipping data-dependent validation."
            echo "Set a DVC remote (dvc remote add) or place the dataset at data/external/tweets_v8.csv to enable full pipeline validation."
            exit 0
          fi

      - name: Run pipeline
        run: |
          dvc repro

      - name: Run model signature test
        run: |
          pytest scripts/test_model_signature.py -v

      - name: Run model performance test
        run: |
          pytest scripts/test_model_performance.py -v

      - name: Promote model to production
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/promote_model.py

      - name: Build Docker image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker build -t tweet-sentiment-plugin .