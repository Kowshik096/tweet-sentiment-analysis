[flake8]
max-line-length = 99
extend-ignore = E203,W503
# E402 (module-level import not at top) is intentional in these files:
#  - flask_app/app.py and src/model/model_evaluation.py set the matplotlib
#    Agg backend before importing pyplot, and manipulate sys.path for the
#    src package;
#  - the test scripts insert the repo root onto sys.path before importing
#    the project package.
per-file-ignores =
    flask_app/app.py:E402
    src/model/model_evaluation.py:E402
    scripts/test_flask_api.py:E402
    scripts/test_params_flatten.py:E402
    scripts/test_preprocessing.py:E402
exclude = .git,__pycache__,myenv,build,dist,notebooks

[tox]
envlist = py310

[testenv]
deps =
    -rrequirements.txt
commands =
    pytest scripts/ -v
